# ──────────────────────────────────────────────
# Server CI 파이프라인 (Go 백엔드)
#
# 실행 시점: server/ 또는 이 워크플로 파일이 바뀐 push / Pull Request, 수동 실행
#
# Job 구성:
#   1. server-static : 정적 검사 — 린트 → 포맷 → 코드 복잡도 → 타입 검사
#                      (코드를 실행하지 않고 잡을 수 있는 문제)
#   2. server-docker : Docker 이미지 빌드 → 컨테이너 실행 → 헬스체크
#                      (server-static이 성공해야 실행)
#
# 검사 기준은 server/.golangci.yml 에 있다.
# 단위 테스트, DB 연결, 통합 테스트는 서버 기능 구현 후 이 파일에 job으로 추가한다.
# ──────────────────────────────────────────────

name: Server

on:
  push:
    branches: [main, "milestone/**"]
    paths:
      - "server/**"
      - ".github/workflows/server.yaml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yaml"
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

# 기본 권한은 읽기 전용
permissions:
  contents: read

env:
  # golangci-lint 버전 (고정). 올릴 때는 로컬에서도 같은 버전으로 확인한다.
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  # ── 1. 정적 검사 ──
  server-static:
    name: Server - 정적 검사 (린트 / 포맷 / 복잡도 / 타입)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v6

      # Go 버전은 server/go.mod 의 go 지시어를 따른다. 모듈/빌드 캐시도 함께 설정된다.
      - name: Go 설정
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # 공식 설치 스크립트로 고정 버전의 실행 파일을 내려받는다.
      - name: golangci-lint 설치
        run: |
          curl -sSfL https://golangci-lint.run/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          golangci-lint version

      # go.mod / go.sum 이 코드와 맞는지 확인한다. (실패 시 로컬에서 `go mod tidy` 후 커밋)
      - name: 의존성 정리 상태 확인 (go mod tidy)
        run: go mod tidy -diff

      # 버그 가능성, 오류 처리 누락, 보안 취약 패턴 등 (.golangci.yml 의 linters)
      - name: 린트 (golangci-lint)
        if: ${{ !cancelled() }}
        run: golangci-lint run

      # gofumpt + goimports 기준과 다르면 차이를 출력하고 실패한다.
      # (실패 시 로컬에서 `golangci-lint fmt` 실행 후 커밋)
      - name: 포맷 검사 (gofumpt / goimports)
        if: ${{ !cancelled() }}
        run: golangci-lint fmt --diff

      # 함수별 순환 복잡도 / 인지 복잡도 / if 중첩 / 함수 길이 상한 검사.
      # 기준값은 .golangci.yml 의 linters.settings 에 있다.
      - name: 코드 복잡도 검사
        if: ${{ !cancelled() }}
        run: golangci-lint run --enable-only gocyclo,gocognit,nestif,funlen

      # Go는 컴파일 언어라 타입 검사 = 컴파일이다.
      # go build 로 전체 패키지를, go vet 으로 테스트 코드까지 컴파일하며 의심스러운 코드를 찾는다.
      - name: 타입 검사 (go build / go vet)
        if: ${{ !cancelled() }}
        run: |
          go build ./...
          go vet ./...

  # ── 2. Docker 빌드 + 헬스체크 ──
  server-docker:
    name: Server - Docker
    needs: server-static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 이미지/컨테이너 이름
      IMAGE: weather-server:ci
      CONTAINER: weather-server
      # 헬스체크 대기 최대 시간(초)
      HEALTH_TIMEOUT: 60
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v6

      - name: 이미지 빌드
        run: docker build -t "$IMAGE" server

      # Dockerfile의 HEALTHCHECK 주기(30s)는 CI에서 2s로 줄여 빠르게 확인한다.
      - name: 컨테이너 실행
        run: |
          docker run -d --name "$CONTAINER" -p 8080:8080 \
            --health-interval=2s --health-timeout=3s --health-retries=5 \
            "$IMAGE"

      - name: 헬스체크 대기 (healthy 상태 확인)
        run: |
          for i in $(seq "$HEALTH_TIMEOUT"); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER")
            echo "[$i s] health=$status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "::error::컨테이너가 종료되었습니다."; exit 1
            fi
            sleep 1
          done
          echo "::error::${HEALTH_TIMEOUT}초 안에 healthy 상태가 되지 않았습니다."
          exit 1

      - name: 스모크 테스트 (GET /healthz)
        run: |
          body=$(curl -sf http://localhost:8080/healthz)
          echo "$body"
          [ "$body" = '{"status":"ok"}' ] || { echo "::error::헬스체크 응답이 올바르지 않습니다."; exit 1; }

      - name: 실패 시 컨테이너 로그 출력
        if: failure()
        run: docker logs "$CONTAINER" || true

      - name: 컨테이너 정리
        if: always()
        run: docker rm -f "$CONTAINER" || true
